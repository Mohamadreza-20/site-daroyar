    <noscript
      ><style>
        #boot {
          display: none;
        }
      </style></noscript
    >
    <style>
      #boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: linear-gradient(160deg, #e8f7f4, #fff 60%);
        transition:
          opacity 0.45s ease,
          visibility 0.45s;
      }
      #boot.is-hidden {
        opacity: 0;
        visibility: hidden;
      }
      #boot .cross {
        position: relative;
        width: 54px;
        height: 54px;
        animation: bootPulse 1.2s ease-in-out infinite;
      }
      #boot .cross::before,
      #boot .cross::after {
        content: '';
        position: absolute;
        background: #0b8576;
        border-radius: 6px;
      }
      #boot .cross::before {
        inset: 0 19px;
      }
      #boot .cross::after {
        inset: 19px 0;
        background: #ff7a59;
      }
      #boot p {
        margin: 0;
        font:
          800 22px Tahoma,
          sans-serif;
        color: #0e2a2f;
        letter-spacing: -0.3px;
      }
      @keyframes bootPulse {
        0%,
        100% {
          transform: scale(0.9) rotate(0);
        }
        50% {
          transform: scale(1.1) rotate(90deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-hidden="true">
      <div class="cross"></div>
      <p>دارویار</p>
    </div>
    <div id="root"></div>
